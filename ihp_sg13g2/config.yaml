VERILOG_INCLUDE_DIRS:
  - dir::../src
  - dir::../src/ihp_sg13g2
  - dir::../deps/asic-cells/src/pipeline

# Slang parses the SystemVerilog; a single compilation unit makes the include
# guards work across files (some files are both included and listed above)
USE_SLANG: true
SLANG_ARGUMENTS:
  - --single-unit

# The Verilator linter does not know the SRAM macros; Slang does the checking
RUN_LINTER: false

# Floorplan: the die area and the placement of the SRAM macros are generated by
# ihp_sg13g2/floorplan.py (see the docstring there for the layout). The vertical halo
# keeps standard cells out of the routing channels in front of the macro pin edges.
FP_MACRO_VERTICAL_HALO: 55
FP_MACRO_HORIZONTAL_HALO: 10

# Connect the SRAM power pins to the supply nets and the TopMetal2 straps to their
# Metal4 power stripes (see ihp_sg13g2/pdn_cfg.tcl)
PDN_CFG: dir::pdn_cfg.tcl
PDN_MACRO_CONNECTIONS:
  - ".*sram VPWR VGND VDD! VSS!"
  - ".*sram VPWR VGND VDDARRAY! VSS!"

# BEGIN floorplan (generated by ihp_sg13g2/floorplan.py, do not edit by hand)
FP_SIZING: absolute
DIE_AREA: [0, 0, 3426.72, 2540.16]

