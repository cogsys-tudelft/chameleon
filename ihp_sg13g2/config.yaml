# LibreLane configuration for synthesizing the full-size Chameleon on IHP SG13G2.
#
# Run from the code directory, inside LibreLane's environment, with the IHP PDK enabled:
#   librelane --pdk ihp-sg13g2 --to OpenROAD.STAPrePNR ihp_sg13g2/config.yaml
#
# Requires the dependencies to be fetched (bender checkout), the configuration
# memory RTL to be generated (make configure) and the SRAM Liberty files to be
# patched (make ihp_sram_libs) first.

DESIGN_NAME: chameleon

# USE_FOUNDRY_SRAMS and USE_RING_OSCILLATOR are left undefined: the memory wrappers
# use the type_t SRAMs (mapped to IHP macros below) and the ring oscillator clock
# generator of the original chip is not included, so the external clock drives all
# logic (clk_int is tied to 0).

# 10 MHz. CLOCK_PERIOD sets the delay target of ABC during synthesis; chameleon.sdc
# has the full constraints for STA and must use the same period.
CLOCK_PORT: clk_ext
CLOCK_PERIOD: 100
PNR_SDC_FILE: dir::chameleon.sdc
SIGNOFF_SDC_FILE: dir::chameleon.sdc

VERILOG_FILES:
  # Dependencies (asic-cells and verilog-array-operations, fetched with Bender)
  - dir::../deps/asic-cells/src/aer/high_speed_in_bus.v
